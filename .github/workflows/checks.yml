name: 💯 Checks
run-name: ${{ github.event_name == 'pull_request' && format('💯 Checks | {0}', github.event.pull_request.title) || '💯 Checks' }}

on:
  workflow_dispatch:
  pull_request:

jobs:
  checks:
    name: 💯 Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: askit_admin
          POSTGRES_PASSWORD: askit_password
          POSTGRES_DB: askit
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      ENVIRONMENT: test
      POSTGRES_USER: askit_admin
      POSTGRES_PASSWORD: askit_password
      POSTGRES_DB: askit
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production-use-0000
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production-use-000

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 📦 Install dependencies
        run: uv sync --frozen

      - name: 🗄️ Create test database
        run: |
          PGPASSWORD=askit_password psql -h localhost -U askit_admin -d askit \
            -c "CREATE DATABASE askit_test;"

      - name: 📐 Format check
        run: uv run ruff format --check .

      - name: 🧹 Lint
        run: uv run ruff check .

      - name: 🔍 Type check
        run: uv run mypy .

      - name: 🧪 Test
        run: uv run pytest
